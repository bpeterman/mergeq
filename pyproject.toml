[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-mergeq"
version = "0.1.0"
description = "A local, sequential GitHub pull request merge queue"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mergeq = "mergeq.cli:main"

[tool.setuptools.packages.find]
include = ["mergeq*"]
